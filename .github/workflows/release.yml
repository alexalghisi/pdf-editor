name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'desktop/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:web

      - name: Desktop wrapper tests
        working-directory: desktop
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  ios:
    uses: ./.github/workflows/ios.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PDF-Editor-Android.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install PDF-Editor-Android.apk
            adb shell monkey -p com.alghisi.pdfeditor -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell pidof com.alghisi.pdfeditor
            adb exec-out screencap -p > android-home.png

      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: android-home.png

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: PDF-Editor-Android.apk

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable --x64
          - os: ubuntu-latest
            target: --linux AppImage --x64
          - os: macos-15
            target: --mac dir --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Package
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Collect Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir out
          cp desktop/release/*.exe out/PDF-Editor-Windows-x64.exe

      - name: Collect Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir out
          cp desktop/release/*.AppImage out/PDF-Editor-Linux-x86_64.AppImage

      - name: Sign and collect macOS builds
        if: runner.os == 'macOS'
        run: |
          mkdir out
          pack() {
            codesign --force --deep --sign - "desktop/release/$1/PDF Editor.app"
            codesign --verify --deep "desktop/release/$1/PDF Editor.app"
            ditto -c -k --keepParent "desktop/release/$1/PDF Editor.app" "out/$2"
          }
          pack mac-arm64 PDF-Editor-macOS-Apple-Silicon.zip
          pack mac PDF-Editor-macOS-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, ios, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather files
        run: |
          mkdir files
          cp artifacts/ios-builds/* files/
          cp artifacts/android-build/* files/
          cp artifacts/desktop-*/* files/
          (cd artifacts/web-dist && zip -qr ../../files/PDF-Editor-Web.zip .)
          ls -la files

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "PDF Editor $GITHUB_REF_NAME" --notes "Downloads for every platform."
          gh release upload "$GITHUB_REF_NAME" files/* --clobber
