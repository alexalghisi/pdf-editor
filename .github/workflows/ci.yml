name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Jest runs through Babel, which strips types without checking them, so
      # a green suite says nothing about whether the project compiles.
      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test -- --ci --coverage

      - name: Web build
        run: npm run build:web

      # Opens a real PDF in the built app with Chrome, edits its text and
      # saves it as PDF, Word and CSV, on a desktop and a phone viewport.
      - name: End-to-end text editing
        run: CHROME_PATH="$(which google-chrome)" npm run e2e

      - name: Upload e2e failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore
